<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1411" />
    <!-- Installable as an app (Chrome/Edge "Install", iOS "Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Roomlet</title>
    <meta name="description" content="Design your dream room and desk setup in 3D, right in your browser: place furniture, recolour everything, change the weather and take photos." />
    <!-- Link previews (WhatsApp, Discord, iMessage…) for the site and for shared rooms -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Roomlet" />
    <meta property="og:description" content="Design your dream room and desk setup in 3D, right in your browser." />
    <meta property="og:image" content="https://vedpawar1410.github.io/dream-setup/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!-- Splash styles are inline so they paint before any CSS or JS has downloaded -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #3a2c22, #1a1411 70%);
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        color: #fbf1e6;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .splash-title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .splash-bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.12);
        overflow: hidden;
      }
      /* Until the JS arrives there's nothing to measure, so the bar just sweeps */
      .splash-bar i {
        display: block;
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #ffb36b;
        animation: splash-sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .determinate .splash-bar i {
        width: 100%;
        transform-origin: left;
        transform: scaleX(0);
        animation: none;
      }
      /* Hidden until the JS can measure real progress */
      .splash-pct {
        margin-top: -6px;
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: #bba895;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .determinate .splash-pct {
        opacity: 1;
      }
      @keyframes splash-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(290%); }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Loading">
      <div class="splash-inner">
        <div class="splash-title">Roomlet</div>
        <div class="splash-bar"><i></i></div>
        <div class="splash-pct">0%</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
