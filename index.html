<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1622" />
    <title>Dream Setup</title>
    <!-- Splash styles are inline so they paint before any CSS or JS has downloaded -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 45%, #3a3050, #17121f 70%);
        font-family: ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        color: #f4eefc;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .splash-title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .splash-bar {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.12);
        overflow: hidden;
      }
      /* Until the JS arrives there's nothing to measure, so the bar just sweeps */
      .splash-bar i {
        display: block;
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: #b18cff;
        animation: splash-sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .determinate .splash-bar i {
        width: 100%;
        transform-origin: left;
        transform: scaleX(0);
        animation: none;
      }
      @keyframes splash-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(290%); }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Loading">
      <div class="splash-inner">
        <div class="splash-title">Dream Setup</div>
        <div class="splash-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
